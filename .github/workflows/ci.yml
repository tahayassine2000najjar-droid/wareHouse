name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Install, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: wareHouse/package-lock.json

      - name: Install dependencies
        working-directory: wareHouse
        run: npm ci

      - name: Run tests
        working-directory: wareHouse
        run: npm test -- --ci --coverage

      - name: Build the project
        working-directory: wareHouse
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret
          MONGODB_URI: mongodb://localhost:27017/warehouse-test

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t warehouseos-ci ./wareHouse
